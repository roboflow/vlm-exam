# Opt-in production configuration. Not part of the published benchmark inventory.
labs:
  google:
    name: Google
    color: "#4285F4"
    logo_url: https://svgl.app/library/google.svg
models:
  gemini-4-hydrogen:
    name: Gemini 4 Hydrogen
    lab: google
    routes:
      - provider: google
        provider_model_id: gemini-4-hydrogen
        options:
          api_version: v1beta
          max_output_tokens: 131072
          thinking_levels:
            low: low
            medium: medium
            high: xhigh
    detection_coordinate_format: yxyx_normalized_0_to_1000
    pricing:
      input_per_million_tokens: 1.5
      output_per_million_tokens: 7.5
