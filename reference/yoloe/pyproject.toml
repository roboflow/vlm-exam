[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vlm-exam-yoloe"
version = "0.1.0"
description = "YOLO-E reference environment for vlm-exam"
requires-python = ">=3.10"
dependencies = [
    "vlm-exam",
    "ultralytics>=8.3.99",
    "torch",
    "torchvision",
    "clip",
]

[tool.uv.sources]
vlm-exam = { path = "../..", editable = true }
clip = { git = "https://github.com/ultralytics/CLIP.git" }

[tool.hatch.build.targets.wheel]
packages = ["src/vlm_exam_yoloe"]
